# Hrizzup: every merge to main updates staging (runbook Part 9; blueprint section 6).
#
# In the same order as a production release: the database first, then the code.
#   0. Check, by name only and before loading any key, that every name in Doppler `stg` is
#      one of the app's keys (infra/doppler/app-keys.txt), so a tool token there stops the job.
#   1. Apply any new migrations (infra/supabase/migrations) to staging's database, over
#      DATABASE_URL_SESSION (Supabase's pooler in session mode; infra/supabase/database_url.py
#      fills in the password, as production's release pipeline does).
#   2. Check that every table of ours is still locked (row-level security).
#   3. Move the `staging` branch to this commit (only this workflow can: ruleset
#      "staging"). Vercel's custom environment "staging" follows that branch.
#   4. Ask Vercel to build it, through the deploy hook "Staging workflow" (it builds the
#      newest commit of the `staging` branch with staging's keys, Doppler `stg`). This is
#      the only way staging gets built: Vercel's own build on a push to `staging` is off
#      (`git.deploymentEnabled` in product/web/vercel.json), so each merge builds once.
#   5. Wait until staging.hrizzup.com serves this commit, from bom1, with every service
#      answering. The workflow is green only when staging really runs the merge.
#
# Staging's keys come from Doppler through a read-only token for `stg`, kept in the GitHub
# environment "hrizzup-staging", which only `main` can use, with the deploy hook's address
# (VERCEL_STAGING_DEPLOY_HOOK). Every value is masked in logs.

name: Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: false # merges reach staging one at a time, in order

jobs:
  staging:
    name: Update staging
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: hrizzup-staging
    permissions:
      contents: read
    steps:
      # The ruleset "staging" lets only a deploy key move the staging branch. This one is
      # held only by this workflow (secret STAGING_DEPLOY_KEY in the environment
      # hrizzup-staging), so staging only ever runs commits that reached main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.STAGING_DEPLOY_KEY }}

      # Before any key is loaded: every name in stg must be one of the app's keys
      # (infra/doppler/app-keys.txt). Anything else there, such as a tool token, reaches
      # every staging build and this job, so the job stops here instead (runbook Part 4,
      # "Where each kind of key lives"). Names only: Doppler's names endpoint sends no values.
      - name: 0. Staging's keys are the app's own (names only)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: python3 infra/doppler/app_keys.py check stg

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # The packages come from main's whole store in GitHub's cache (the key setup-node uses,
      # filled by full installs: the Tool cache workflow and App journeys), read only: this job
      # installs one package's few dependencies, and a store saved from here would hold only
      # those under the key every pull request reads. Anything missing comes from npm, retried.
      - name: Where pnpm keeps its packages
        id: store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: The packages, from GitHub's cache (read only)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.store.outputs.path }}
          key: node-cache-${{ runner.os }}-x64-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile --filter @hrizzup/database

      - name: Staging's keys (Doppler stg, masked)
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          inject-env-vars: true

      - name: 1. Apply new migrations to staging's database
        working-directory: infra/supabase
        run: python3 database_url.py run session -- sh -c 'pnpm exec supabase --workdir .. db push --db-url "$DATABASE_ADDRESS" --skip-vault --yes'

      - name: 2. Check that every table is locked
        env:
          PGSSLMODE: verify-full
          PGSSLROOTCERT: infra/supabase/supabase-root-2021-ca.crt
        run: python3 infra/supabase/database_url.py run session -- sh -c 'psql "$DATABASE_ADDRESS" -q -v ON_ERROR_STOP=1 -f infra/supabase/checks/every_table_locked.sql'

      - name: 3. Move the staging branch to this commit
        env:
          COMMIT: ${{ github.sha }}
        run: git push origin "$COMMIT:refs/heads/staging"

      - name: 4. Ask Vercel to build staging
        env:
          VERCEL_STAGING_DEPLOY_HOOK: ${{ secrets.VERCEL_STAGING_DEPLOY_HOOK }}
        run: curl -fsS -o /dev/null -X POST "$VERCEL_STAGING_DEPLOY_HOOK"

      - name: 5. Wait until staging serves this commit
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: python3 .github/scripts/wait_for_staging.py "${{ github.sha }}"

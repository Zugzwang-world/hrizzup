# Hrizzup: secret check on every pull request.
#
# Runs the open-source gitleaks scanner over the repository's whole history
# on every pull request. "main" only accepts a pull request once this check
# has passed (GitHub ruleset "main"). It can also be run by hand.
#
# gitleaks is pinned (its version and checksum in .github/scripts/tools.py) and
# read from GitHub's cache by that pin (the Tool cache workflow fills it from
# main). When a run must download it, the download goes through GitHub's API,
# signed in with the job's own token, and is retried after a pause: on
# 9 November 2026 GitHub answered anonymous release downloads with 504 errors
# for hours. Its checksum is checked before it runs, wherever it came from;
# actions/checkout is pinned to a commit.

name: Secret check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-check:
    # This name is the required check in the "main" ruleset. Keep them in step.
    name: Secret check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the whole history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks's pinned version
        id: pin
        run: python3 .github/scripts/tools.py key gitleaks >> "$GITHUB_OUTPUT"
      - name: gitleaks, from GitHub's cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pin.outputs.gitleaks_file }}
          key: ${{ steps.pin.outputs.gitleaks_key }}
      - name: Install gitleaks (pinned version, checksum checked)
        env:
          GITHUB_TOKEN: ${{ github.token }} # signed-in downloads from GitHub; read-only
          ARCHIVE: ${{ steps.pin.outputs.gitleaks_path }}
        run: |
          set -euo pipefail
          python3 .github/scripts/tools.py fetch gitleaks
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan the whole history for secrets
        run: gitleaks git --redact --no-banner --verbose .

# Hrizzup: secret check on every pull request.
#
# Runs the open-source gitleaks scanner over the repository's whole history
# on every pull request. "main" only accepts a pull request once this check
# has passed (GitHub ruleset "main"). It can also be run by hand.
#
# gitleaks is downloaded at a pinned version and its checksum is checked
# before it runs; actions/checkout is pinned to a commit.

name: Secret check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-check:
    # This name is the required check in the "main" ruleset. Keep them in step.
    name: Secret check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the whole history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned version, checksum checked)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan the whole history for secrets
        run: gitleaks git --redact --no-banner --verbose .

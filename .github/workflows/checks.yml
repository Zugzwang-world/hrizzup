# Hrizzup: the checks on every pull request (PLAN.md section 3, "Checks sized to the change").
#
#   Quick checks    formatting and lint (Biome), type checks and unit tests (Turborepo),
#                   including the hand-over agreement's check (agreement/src/agreement.test.ts)
#   Database check  builds a fresh database from infra/supabase/migrations and runs its
#                   tests, including "every table is locked" (row-level security)
#   Screen check    once Vercel's preview of the pull request is ready, opens it in
#                   Chromium and WebKit at every screen size (CLAUDE.md, "Screens fit
#                   every device"), signed out and signed in with a staging test account,
#                   then runs the website's journeys (product/web/e2e/journeys: every page
#                   opens; the test account signs in and out)
#   Speed check     the performance budgets (blueprint section 14): every page of the
#                   preview with Lighthouse (mobile preset, median of 5 runs) and the app's
#                   code size against main's; the numbers go on the pull request
#
# The job names are required checks in the "main" ruleset. Keep them in step.
# Turborepo's Remote Cache (Vercel) skips work already done for the same inputs. It signs
# in with GitHub's short-lived OIDC token, so no Vercel token is stored in GitHub.

name: Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: Quick checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # for the Remote Cache's short-lived token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Connect the Remote Cache
        uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        continue-on-error: true # without it the checks still run, just without the cache
        with:
          team: ${{ vars.TURBO_TEAM }}
      - run: pnpm install --frozen-lockfile
      - name: Formatting and lint
        run: pnpm exec biome ci .
      - name: Type checks and unit tests
        run: pnpm exec turbo run typecheck test
      - name: Infrastructure tools' tests
        run: python3 -m unittest discover -s infra/vercel

  database:
    name: Database check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Connect the Remote Cache
        uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        continue-on-error: true
        with:
          team: ${{ vars.TURBO_TEAM }}
      - run: pnpm install --frozen-lockfile
      - name: Fresh database from the migrations, then its tests
        run: pnpm exec turbo run test:db

  screens:
    name: Screen check
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      deployments: read # to find Vercel's preview of this pull request
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Does this change touch the website?
        id: affected
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/affected.py

      - name: Wait for Vercel's preview
        if: steps.affected.outputs.website == 'true'
        id: preview
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/wait_for_preview.py "$COMMIT"

      - name: Staging's keys for the test accounts (Doppler stg_preview, masked)
        if: steps.affected.outputs.website == 'true'
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN_PREVIEW }}
          inject-env-vars: true

      - name: Browsers (Chromium and WebKit)
        if: steps.affected.outputs.website == 'true'
        working-directory: product/web
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Screen check and journeys on the preview
        if: steps.affected.outputs.website == 'true'
        working-directory: product/web
        env:
          BASE_URL: ${{ steps.preview.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          SCREENSHOTS_DIR: ${{ github.workspace }}/screenshots
        run: pnpm exec playwright test

      - name: Screenshots for the founder (360, 768, 1440 and 1920 pixels)
        if: ${{ !cancelled() && steps.affected.outputs.website == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 30

  speed:
    name: Speed check
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      deployments: read # to find Vercel's preview of this pull request
      pull-requests: write # to show the numbers on the pull request
      id-token: write # for the Remote Cache's short-lived token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Connect the Remote Cache
        uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        continue-on-error: true
        with:
          team: ${{ vars.TURBO_TEAM }}
      - run: pnpm install --frozen-lockfile

      - name: Does this change touch the website or the app?
        id: affected
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/affected.py

      # The app: its Android code bundle, built as a build ships it, against main's.
      - name: "App: code size of this change"
        if: steps.affected.outputs.app == 'true'
        run: pnpm exec turbo run bundle-size --filter=@hrizzup/app
      - name: "App: code size on main (usually from the Remote Cache)"
        if: steps.affected.outputs.app == 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/main" "$BASE"
          cd "$RUNNER_TEMP/main"
          if [ ! -f product/app/scripts/bundle-size.ts ]; then
            echo "main doesn't measure the app's code size yet; only the limit is checked."
            exit 0
          fi
          pnpm install --frozen-lockfile --prefer-offline
          pnpm exec turbo run bundle-size --filter=@hrizzup/app
      - name: "App: compare with main"
        id: app
        if: steps.affected.outputs.app == 'true'
        working-directory: product/app
        run: node scripts/bundle-size.ts compare "$RUNNER_TEMP/main/product/app" "$GITHUB_WORKSPACE/speed-results"

      # The website: every page of this pull request's preview.
      - name: "Website: wait for Vercel's preview"
        if: ${{ !cancelled() && steps.affected.outputs.website == 'true' }}
        id: preview
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/wait_for_preview.py "$COMMIT"
      - name: "Website: let Chrome use its sandbox"
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        # Ubuntu 24.04 keeps programs from making the private namespaces Chrome's sandbox needs.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || echo "No such setting here; Chrome starts as it is."
      - name: "Website: prove the check counts other sites' code and embeds"
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        working-directory: product/web
        env:
          SPEED_OUT: ${{ runner.temp }}/speed-self-test
        run: node e2e/speed-check.ts --self-test
      - name: "Website: every page against its budget"
        id: website
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        working-directory: product/web
        env:
          BASE_URL: ${{ steps.preview.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          SPEED_OUT: ${{ github.workspace }}/speed-results
        run: node e2e/speed-check.ts

      - name: The numbers on the pull request
        if: ${{ !cancelled() && (steps.affected.outputs.website == 'true' || steps.affected.outputs.app == 'true') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          WEBSITE_OUTCOME: ${{ steps.website.outcome }}
          APP_OUTCOME: ${{ steps.app.outcome }}
        run: python3 .github/scripts/speed_comment.py speed-results
      - name: Lighthouse's reports (the run nearest each page's median)
        if: ${{ !cancelled() && steps.affected.outputs.website == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: speed-reports
          path: speed-results/reports/
          if-no-files-found: ignore
          retention-days: 30

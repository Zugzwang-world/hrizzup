# Hrizzup: the checks on every pull request (PLAN.md section 3, "Checks sized to the change").
#
#   Quick checks    formatting and lint (Biome), type checks and unit tests (Turborepo),
#                   including the hand-over agreement's check (agreement/src/agreement.test.ts)
#                   and the public API's OpenAPI file kept current; the public API's
#                   breaking-change check (.github/scripts/api_breaking.py, with oasdiff:
#                   within v1, only additions, against main's file);
#                   the infrastructure tools' own tests (infra/vercel, infra/doppler,
#                   infra/slots, infra/supabase) and the checks' own scripts' tests
#                   (.github/scripts: tool downloads, affected parts)
#   Database check  first, the database-order check (infra/supabase/migration_order.py):
#                   every migration the pull request adds comes after the newest one on
#                   main as it is now, none already on main is touched, and
#                   newest-migration.txt names the newest; then builds a fresh database
#                   from infra/supabase/migrations and runs its tests, including "every
#                   table is locked" (row-level security)
#   Screen check    runs on four machines, "Screen check, part 1 of 4" to "part 4 of 4", each
#                   with its own quarter of the tests (Playwright's --shard, the split balanced
#                   by how long each test took last time: product/web/e2e/test-times.json), and
#                   a joining job named "Screen check" that passes only when every part passed
#                   and its records add up to every test run exactly once
#                   (.github/scripts/screen_parts.py). Each part checks by name that Doppler
#                   stg_preview holds only the app's keys (infra/doppler/app-keys.txt), then asks
#                   it for the eight its tests use, by name, for the tests alone
#                   (infra/doppler/named_keys.py); once Vercel's preview of the pull request is
#                   ready, opens it in Chromium and WebKit at every screen size (CLAUDE.md,
#                   "Screens fit every device"), signed out and signed in with a staging test
#                   account, then runs the website's journeys (product/web/e2e/journeys: every
#                   page opens; the test account signs in and out). The joining job also gathers
#                   the parts' screenshots into the one "screenshots" download
#   Speed check     the performance budgets (blueprint section 14): every page of the
#                   preview with Lighthouse (mobile preset, median of 5 runs) and the app's
#                   code size against main's; the numbers go on the pull request
#   Speed check on three machines
#                   a trial, never required, that runs after the Speed check finishes, whatever its
#                   result (so it adds no load while the Speed check measures): the same pages
#                   measured on three machines, six each ("Speed check on three machines, part 1 of
#                   3" to "part 3 of 3": the same Lighthouse runs, budgets and warm-up, SPEED_PART in
#                   product/web/e2e/speed-check.ts), and a comparison job, "Speed check on three
#                   machines", that puts the parts together, judges them as the Speed check does and
#                   compares them with its numbers page by page: each number within that page's
#                   allowance (product/web/e2e/speed-allowances.json, worked out from real checks of
#                   the same code by .github/scripts/speed_allowances.py), every budget verdict and
#                   the contrast verdicts equal. The comparison is kept as an artifact whose name
#                   carries the verdict ("speed-comparison-clean" or "-not-clean"; "-not-run" when
#                   the comparison didn't run, which is passed over), and the job's summary counts
#                   how many pull requests in a row compared clean, with no not-clean record among
#                   any of their pushes (.github/scripts/side_by_side.py).
#                   When five have, and their average difference is within its limits, a later change
#                   makes the three machines the Speed check itself. Nothing here is a required
#                   check, and the comparison fails only when its own machinery breaks, never because
#                   the two differ
#
# The job names are required checks in the "main" ruleset. Keep them in step. A check that runs
# in parts has a joining job with the required name, and the parts' own names differ; the joining
# job runs whatever the parts did and fails unless every part succeeded (GitHub counts a skipped
# required job as passed, so it must never be skipped).
# Turborepo's Remote Cache (Vercel) skips work already done for the same inputs. It signs
# in with GitHub's short-lived OIDC token, so no Vercel token is stored in GitHub.
# The tools these jobs download are pinned and read from GitHub's cache by that pin (the Tool
# cache workflow fills it from main, and the checks only read it): Playwright's browsers by
# Playwright's version, the browsers' system libraries by Playwright's version and the runner
# image's (installed with no network; Ubuntu's mirrors are the fallback), the database's Docker
# images by the Supabase CLI's version, and pnpm's package store by the lockfile's hash
# (.github/scripts/tools.py). A download that's still needed is retried after a pause; a test
# never is.

name: Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: Quick checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # for the Remote Cache's short-lived token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # pnpm's packages come from main's store in GitHub's cache (the Tool cache workflow fills
      # it), read only: with no exact hit, the newest store of main under the same prefix, so a
      # pull request that changes the lockfile downloads only the difference.
      - name: Where pnpm keeps its packages, and main's key for them
        id: store
        run: python3 .github/scripts/tools.py key pnpm-store >> "$GITHUB_OUTPUT"
      - name: The packages, from GitHub's cache (read only)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.store.outputs.pnpm_store_file }}
          key: ${{ steps.store.outputs.pnpm_store_key }}
          restore-keys: ${{ steps.store.outputs.pnpm_store_prefix }}
      - name: Connect the Remote Cache
        uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        continue-on-error: true # without it the checks still run, just without the cache
        with:
          team: ${{ vars.TURBO_TEAM }}
      - run: pnpm install --frozen-lockfile
      - name: Formatting and lint
        run: pnpm exec biome ci .
      - name: Type checks and unit tests
        run: pnpm exec turbo run typecheck test
      # The public API's OpenAPI file against main's: within v1, only additions (PLAN.md step
      # 3.5a). oasdiff is pinned and read from GitHub's cache like every tool (tools.py).
      - name: oasdiff's pinned version
        id: oasdiff
        run: python3 .github/scripts/tools.py key oasdiff >> "$GITHUB_OUTPUT"
      - name: oasdiff, from GitHub's cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.oasdiff.outputs.oasdiff_file }}
          key: ${{ steps.oasdiff.outputs.oasdiff_key }}
      - name: Install oasdiff (pinned version, checksum checked)
        env:
          GITHUB_TOKEN: ${{ github.token }} # signed-in downloads from GitHub; read-only
          ARCHIVE: ${{ steps.oasdiff.outputs.oasdiff_path }}
        run: |
          set -euo pipefail
          python3 .github/scripts/tools.py fetch oasdiff
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP" oasdiff
          echo "OASDIFF=$RUNNER_TEMP/oasdiff" >> "$GITHUB_ENV"
      - name: The public API's breaking-change check (within v1, only additions)
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          python3 .github/scripts/api_breaking.py --main FETCH_HEAD
      - name: Infrastructure tools' tests
        run: |
          python3 -m unittest discover -s infra/vercel
          python3 -m unittest discover -s infra/doppler
          python3 -m unittest discover -s .github/scripts
          python3 -m unittest discover -s infra/slots
          python3 -m unittest discover -s infra/supabase
          python3 -m unittest discover -s infra/supabase/auth

  database:
    name: Database check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # main as it is now, and where this pull request branched from it
          persist-credentials: false
      # Staging and production apply migrations in timestamp order and refuse an older one,
      # so the pull request's new migrations must come after main's newest. If main gains a
      # migration after this passes, newest-migration.txt's one line conflicts, so GitHub
      # won't merge this until it's rebased and this runs again (CLAUDE.md, "Database changes").
      - name: The database-order check (rename your migration if main has moved past it)
        env:
          HEAD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 infra/supabase/migration_order.py --main origin/main --head "$HEAD_COMMIT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # pnpm's packages come from main's store in GitHub's cache (the Tool cache workflow fills
      # it), read only: with no exact hit, the newest store of main under the same prefix, so a
      # pull request that changes the lockfile downloads only the difference.
      - name: Where pnpm keeps its packages, and main's key for them
        id: store
        run: python3 .github/scripts/tools.py key pnpm-store >> "$GITHUB_OUTPUT"
      - name: The packages, from GitHub's cache (read only)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.store.outputs.pnpm_store_file }}
          key: ${{ steps.store.outputs.pnpm_store_key }}
          restore-keys: ${{ steps.store.outputs.pnpm_store_prefix }}
      - name: Connect the Remote Cache
        uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        continue-on-error: true
        with:
          team: ${{ vars.TURBO_TEAM }}
      - run: pnpm install --frozen-lockfile
      # The database's images (Postgres and the services that set up its schema) come from
      # GitHub's cache, by the Supabase CLI's version, when the tests will really run here
      # rather than come from the Remote Cache. Without them, the CLI pulls them itself, retrying.
      - name: Will the database tests run here?
        id: db
        run: python3 .github/scripts/tools.py database will-run >> "$GITHUB_OUTPUT"
      - name: The database's images, by the Supabase CLI's version
        id: images-key
        if: steps.db.outputs.run == 'true'
        run: python3 .github/scripts/tools.py key database-images >> "$GITHUB_OUTPUT"
      - name: The database's images, from GitHub's cache
        id: images
        if: steps.db.outputs.run == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.images-key.outputs.database_images_file }}
          key: ${{ steps.images-key.outputs.database_images_key }}
      - name: Load them into Docker
        if: steps.images.outputs.cache-hit == 'true'
        env:
          IMAGES: ${{ steps.images-key.outputs.database_images_path }}
        # Only a shortcut: if the copy won't load, the CLI pulls the images as before.
        run: |
          docker load -i "$IMAGES" || echo "::warning::The cached images didn't load; the Supabase CLI pulls them instead."
          rm -f "$IMAGES"
      - name: Fresh database from the migrations, then its tests
        run: pnpm exec turbo run test:db

  # One of the Screen check's four parts: the same steps on four machines at once, each running
  # its own tests (--shard=N/4, balanced by e2e/test-times.json). A part whose change doesn't
  # touch the website passes at once and leaves a record saying so; none is ever skipped, so the
  # joining job always has four records to add up.
  screen-part:
    name: Screen check, part ${{ matrix.part }} of 4
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    permissions:
      contents: read
      deployments: read # to find Vercel's preview of this pull request
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # pnpm's packages come from main's store in GitHub's cache (the Tool cache workflow fills
      # it), read only: with no exact hit, the newest store of main under the same prefix, so a
      # pull request that changes the lockfile downloads only the difference.
      - name: Where pnpm keeps its packages, and main's key for them
        id: store
        run: python3 .github/scripts/tools.py key pnpm-store >> "$GITHUB_OUTPUT"
      - name: The packages, from GitHub's cache (read only)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.store.outputs.pnpm_store_file }}
          key: ${{ steps.store.outputs.pnpm_store_key }}
          restore-keys: ${{ steps.store.outputs.pnpm_store_prefix }}
      - run: pnpm install --frozen-lockfile

      - name: Does this change touch the website?
        id: affected
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/affected.py

      - name: Wait for Vercel's preview
        if: steps.affected.outputs.website == 'true'
        id: preview
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/wait_for_preview.py "$COMMIT"

      # The browsers, before any key is loaded: Playwright's Chromium and WebKit, at the builds
      # its version (from the lockfile) names, from GitHub's cache. Playwright skips any it
      # already has; a download it still needs is retried after a pause (tools.py retry, which
      # refuses anything but this download). The system libraries come from GitHub's cache too,
      # the exact packages Playwright's install-deps would install, kept by Playwright's version
      # and the machine image's and installed with no network (tools.py libraries install); when
      # the cache has no set for this image (an image update, about weekly, until the Tool cache
      # workflow runs again), install-deps fetches them from Ubuntu's mirrors through apt, which
      # retries on its own, as before.
      - name: The browsers' cache key (Playwright's version)
        id: browsers-key
        if: steps.affected.outputs.website == 'true'
        run: python3 .github/scripts/tools.py key browsers >> "$GITHUB_OUTPUT"
      - name: The browsers, from GitHub's cache
        if: steps.affected.outputs.website == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.browsers-key.outputs.browsers_file }}
          key: ${{ steps.browsers-key.outputs.browsers_key }}
      - name: The browsers' system libraries' cache key (Playwright's version, the machine image)
        id: libraries-key
        if: steps.affected.outputs.website == 'true'
        run: python3 .github/scripts/tools.py key browser-libraries >> "$GITHUB_OUTPUT"
      - name: The browsers' system libraries, from GitHub's cache
        id: libraries-cache
        if: steps.affected.outputs.website == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.libraries-key.outputs.browser_libraries_file }}
          key: ${{ steps.libraries-key.outputs.browser_libraries_key }}
      # Each install has its own time limit, so a hang on GitHub's machine fails in minutes and is
      # re-run as an outage instead of holding the part to the job's 40 (R7's finding, 18 November
      # 2026: part 2 hung here 20 to 37 minutes after its caches restored). Healthy, each takes
      # seconds. Only the libraries' fallback through Ubuntu's mirrors, when the cache has no set
      # for this machine image, can take half an hour (R8's #196 and #198), so it keeps 35.
      - name: Browsers (Chromium and WebKit)
        if: steps.affected.outputs.website == 'true'
        timeout-minutes: 10
        working-directory: product/web
        run: python3 ../../.github/scripts/tools.py retry -- pnpm exec playwright install chromium webkit
      - name: The browsers' system libraries
        if: steps.affected.outputs.website == 'true'
        timeout-minutes: ${{ steps.libraries-cache.outputs.cache-hit == 'true' && 10 || 35 }}
        working-directory: product/web
        run: python3 ../../.github/scripts/tools.py libraries install || pnpm exec playwright install-deps chromium webkit

      # Before any key is loaded: every name in stg_preview must be one of the app's keys
      # (infra/doppler/app-keys.txt), so a tool token there stops this job before it sits
      # beside the pull request's code (runbook Part 4, "Where each kind of key lives").
      # Names only: Doppler's names endpoint sends no values.
      - name: The previews' keys are the app's own (names only)
        if: steps.affected.outputs.website == 'true'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PREVIEW }}
        run: python3 infra/doppler/app_keys.py check stg_preview

      # The tests' own keys and nothing more, asked of stg_preview by name and given to the
      # tests' process alone, masked, never the whole config and never to a later step
      # (infra/doppler/named_keys.py, which refuses any name that isn't one of the app's keys):
      # the run's own accounts' three (Supabase: each run makes its own, funded by their signup's
      # starting balance; e2e/support/run.ts), the bot check's site key (the sign-in journey) and
      # the uploads bucket's four (the upload journey). No database address or password: no test
      # reaches staging's database except through the preview. A test that reads another app key,
      # here or in a module it imports, fails infra/doppler/test_workflows.py until it's added.
      - name: Screen check and journeys on the preview
        if: steps.affected.outputs.website == 'true'
        working-directory: product/web
        env:
          BASE_URL: ${{ steps.preview.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          SCREENSHOTS_DIR: ${{ github.workspace }}/screenshots
          PARTS_OUT: ${{ runner.temp }}/screen-part # where this part's record goes (e2e/support/parts.ts)
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PREVIEW }} # read-only, for the eight keys below
        run: >-
          python3 ../../infra/doppler/named_keys.py
          SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_SECRET_KEY TURNSTILE_SITE_KEY
          R2_ENDPOINT R2_BUCKET_UPLOADS R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY
          -- pnpm exec playwright test --shard=${{ matrix.part }}/4

      - name: This part has nothing to test (the change doesn't touch the website)
        if: steps.affected.outputs.website != 'true'
        env:
          PARTS_OUT: ${{ runner.temp }}/screen-part
        run: python3 .github/scripts/screen_parts.py untouched "$PARTS_OUT" ${{ matrix.part }} 4

      # This part's record, for the joining job to add up. A part that left none (it failed before
      # its tests began, or was cancelled) is caught there: four records are expected.
      - name: This part's record
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screen-part-${{ matrix.part }}
          path: ${{ runner.temp }}/screen-part/
          if-no-files-found: ignore
          retention-days: 30 # GitHub allows a re-run for 30 days

      # Each part's own screenshots; once every part has passed, the joining job gathers them into
      # the one "screenshots" download. On a failed run these stay as they are, for the founder.
      - name: Screenshots for the founder (360, 768, 1440 and 1920 pixels), this part's
        if: ${{ !cancelled() && steps.affected.outputs.website == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-part-${{ matrix.part }}
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 30

  # The Screen check itself, the name the ruleset requires: it runs whatever the parts did (never
  # skipped, because GitHub counts a skipped required job as passed), fails unless every part
  # succeeded, and proves the parts ran every test exactly once.
  screens:
    name: Screen check
    needs: screen-part
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # First, and read through env: so the decision can't depend on any other step. The records are
      # added up whatever it says (so the log names what is missing), and the job still fails.
      - name: Every part passed
        if: ${{ always() }}
        env:
          PARTS: ${{ needs.screen-part.result }}
        run: |
          if [ "$PARTS" != "success" ]; then
            echo "::error title=The Screen check's parts::The four parts' result is '$PARTS', not 'success': a part failed, was cancelled or didn't run."
            exit 1
          fi
          echo "All four parts passed."
      - name: The checks' own scripts
        if: ${{ always() }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: The parts' records
        if: ${{ always() }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: screen-part-*
          path: ${{ runner.temp }}/parts
      - name: The four parts ran every test exactly once
        id: parts
        if: ${{ always() }}
        run: python3 .github/scripts/screen_parts.py add-up "$RUNNER_TEMP/parts" 4 >> "$GITHUB_OUTPUT"
      # Only after a good run: the merge deletes the parts' own copies, so after a failed attempt
      # they must all still be there (for the founder, and for a re-run of the failed parts).
      - name: Screenshots for the founder (360, 768, 1440 and 1920 pixels)
        if: ${{ success() && steps.parts.outputs.website == 'true' }}
        uses: actions/upload-artifact/merge@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          pattern: screenshots-part-*
          delete-merged: true
          retention-days: 30
      - name: How long each test took, for the next balance
        if: ${{ success() && steps.parts.outputs.website == 'true' }}
        run: python3 .github/scripts/screen_parts.py times "$RUNNER_TEMP/parts" "$RUNNER_TEMP/test-times.json"
      - name: The times, to refresh product/web/e2e/test-times.json from
        if: ${{ success() && steps.parts.outputs.website == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screen-test-times
          path: ${{ runner.temp }}/test-times.json
          retention-days: 30


  speed:
    name: Speed check
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      deployments: read # to find Vercel's preview of this pull request
      pull-requests: write # to show the numbers on the pull request
      id-token: write # for the Remote Cache's short-lived token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # pnpm's packages come from main's store in GitHub's cache (the Tool cache workflow fills
      # it), read only: with no exact hit, the newest store of main under the same prefix, so a
      # pull request that changes the lockfile downloads only the difference.
      - name: Where pnpm keeps its packages, and main's key for them
        id: store
        run: python3 .github/scripts/tools.py key pnpm-store >> "$GITHUB_OUTPUT"
      - name: The packages, from GitHub's cache (read only)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.store.outputs.pnpm_store_file }}
          key: ${{ steps.store.outputs.pnpm_store_key }}
          restore-keys: ${{ steps.store.outputs.pnpm_store_prefix }}
      - name: Connect the Remote Cache
        uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        continue-on-error: true
        with:
          team: ${{ vars.TURBO_TEAM }}
      - run: pnpm install --frozen-lockfile

      - name: Does this change touch the website or the app?
        id: affected
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/affected.py

      # The app: its Android code bundle, built as a build ships it, against main's.
      - name: "App: code size of this change"
        if: steps.affected.outputs.app == 'true'
        run: pnpm exec turbo run bundle-size --filter=@hrizzup/app
      - name: "App: code size on main (usually from the Remote Cache)"
        if: steps.affected.outputs.app == 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/main" "$BASE"
          cd "$RUNNER_TEMP/main"
          if [ ! -f product/app/scripts/bundle-size.ts ]; then
            echo "main doesn't measure the app's code size yet; only the limit is checked."
            exit 0
          fi
          pnpm install --frozen-lockfile --prefer-offline
          pnpm exec turbo run bundle-size --filter=@hrizzup/app
      - name: "App: compare with main"
        id: app
        if: steps.affected.outputs.app == 'true'
        working-directory: product/app
        run: node scripts/bundle-size.ts compare "$RUNNER_TEMP/main/product/app" "$GITHUB_WORKSPACE/speed-results"

      # The website: every page of this pull request's preview.
      - name: "Website: wait for Vercel's preview"
        if: ${{ !cancelled() && steps.affected.outputs.website == 'true' }}
        id: preview
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/wait_for_preview.py "$COMMIT"
      - name: "Website: let Chrome use its sandbox"
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        # Ubuntu 24.04 keeps programs from making the private namespaces Chrome's sandbox needs.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || echo "No such setting here; Chrome starts as it is."
      - name: "Website: prove the check counts other sites' code and embeds"
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        working-directory: product/web
        env:
          SPEED_OUT: ${{ runner.temp }}/speed-self-test
        run: node e2e/speed-check.ts --self-test
      - name: "Website: every page against its budget"
        id: website
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        working-directory: product/web
        env:
          BASE_URL: ${{ steps.preview.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          SPEED_OUT: ${{ github.workspace }}/speed-results
        run: node e2e/speed-check.ts

      - name: The numbers on the pull request
        if: ${{ !cancelled() && (steps.affected.outputs.website == 'true' || steps.affected.outputs.app == 'true') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          WEBSITE_OUTCOME: ${{ steps.website.outcome }}
          APP_OUTCOME: ${{ steps.app.outcome }}
        run: python3 .github/scripts/speed_comment.py speed-results
      - name: Lighthouse's reports (the run nearest each page's median)
        if: ${{ !cancelled() && steps.affected.outputs.website == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: speed-reports
          path: speed-results/reports/
          if-no-files-found: ignore
          retention-days: 30
      # The numbers the three-machine trial below compares with. It's the trial's input, not part of
      # this check: it uploads whenever the measuring step ran (a page over its budget included: the
      # file is written before the check fails), a failed upload never fails this check, and the step
      # can't hold the job for more than two minutes.
      - name: The one-machine numbers, for the three-machine comparison
        if: ${{ !cancelled() && (steps.website.outcome == 'success' || steps.website.outcome == 'failure') }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: speed-one-machine
          path: speed-results/website.json
          if-no-files-found: ignore
          retention-days: 7

  # The trial: the Speed check's website pages on three machines, six each, after the Speed check
  # above has finished, so the trial never loads the preview while the required check measures it
  # (`needs: speed`), and whatever the Speed check's result was (`!cancelled()`): the comparison also
  # wants the runs where a page failed its budget. Each part measures as the Speed check does (its
  # own Chrome, the uncounted warm-up on the home page, each page's five runs, then the dark-scheme
  # contrast runs) and writes its results; the job below puts them together. A part never fails on a
  # budget: the comparison judges.
  speed-part:
    name: Speed check on three machines, part ${{ matrix.part }} of 3
    needs: speed
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    permissions:
      contents: read
      deployments: read # to find Vercel's preview of this pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # pnpm's packages come from main's store in GitHub's cache (the Tool cache workflow fills
      # it), read only: with no exact hit, the newest store of main under the same prefix, so a
      # pull request that changes the lockfile downloads only the difference.
      - name: Where pnpm keeps its packages, and main's key for them
        id: store
        run: python3 .github/scripts/tools.py key pnpm-store >> "$GITHUB_OUTPUT"
      - name: The packages, from GitHub's cache (read only)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.store.outputs.pnpm_store_file }}
          key: ${{ steps.store.outputs.pnpm_store_key }}
          restore-keys: ${{ steps.store.outputs.pnpm_store_prefix }}
      - run: pnpm install --frozen-lockfile

      - name: Does this change touch the website?
        id: affected
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/affected.py

      # The Speed check's own numbers first, by pattern (no failure when they aren't there): the trial
      # has something to compare with only when the Speed check measured. Without them (it never got to
      # measure, say because Vercel missed the preview) this part leaves a "not measured" record at once
      # instead of waiting for a preview that isn't coming, so three parts never poll for 20 minutes
      # against the job token's shared allowance.
      - name: The Speed check's own numbers
        if: steps.affected.outputs.website == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: speed-one-machine
          merge-multiple: true
          path: ${{ runner.temp }}/one
      - name: Did the Speed check measure the website?
        id: one
        if: steps.affected.outputs.website == 'true'
        run: |
          if [ -f "$RUNNER_TEMP/one/website.json" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "Website: wait for Vercel's preview"
        if: steps.affected.outputs.website == 'true' && steps.one.outputs.present == 'true'
        id: preview
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/wait_for_preview.py "$COMMIT"
      - name: "Website: let Chrome use its sandbox"
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        # Ubuntu 24.04 keeps programs from making the private namespaces Chrome's sandbox needs.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || echo "No such setting here; Chrome starts as it is."
      - name: "Website: this part's pages against their budgets (reported, never failed)"
        id: website
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        working-directory: product/web
        env:
          BASE_URL: ${{ steps.preview.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          SPEED_PART: ${{ matrix.part }}/3 # this machine's share of the pages
          SPEED_OUT: ${{ runner.temp }}/speed-part
        run: node e2e/speed-check.ts

      - name: This part has nothing to measure (the change doesn't touch the website)
        if: steps.affected.outputs.website != 'true'
        env:
          SPEED_PART: ${{ matrix.part }}/3
          SPEED_OUT: ${{ runner.temp }}/speed-part
        run: python3 .github/scripts/side_by_side.py untouched "$SPEED_OUT" "$SPEED_PART"
      - name: This part has nothing to compare with (the Speed check left no numbers)
        if: steps.affected.outputs.website == 'true' && steps.one.outputs.present == 'false'
        env:
          SPEED_PART: ${{ matrix.part }}/3
          SPEED_OUT: ${{ runner.temp }}/speed-part
        run: python3 .github/scripts/side_by_side.py not-measured "$SPEED_OUT" "$SPEED_PART"

      # The results the comparison job reads (and the record that this part had nothing to measure);
      # the Lighthouse reports stay with the Speed check's own upload.
      - name: This part's results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: speed-part-${{ matrix.part }}
          path: |
            ${{ runner.temp }}/speed-part/*.json
            ${{ runner.temp }}/speed-part/*.md
          if-no-files-found: ignore
          retention-days: 7

  # The comparison: the parts put together in the page list's order and judged as the Speed check
  # judges, then compared with the Speed check's own numbers page by page, each number within that
  # page's allowance (product/web/e2e/speed-allowances.json, worked out from real checks of the same
  # code). Not a required check, so it never fails on "not clean": the record says so, its artifact's
  # name carries the verdict ("speed-comparison-clean", "-not-clean", or "-not-run" for a comparison
  # that didn't run), and the tally counts it. It fails only when its own machinery breaks. A comparison
  # that errors, or whose parts left no results, while the Speed check's numbers exist is kept as a
  # not-run record, which the tally passes over (neither clean nor not clean). A cancelled run leaves no
  # record: the newer run compares the pull request anyway. Its summary has the verdict for each page
  # and the count of pull requests in a row that compared clean.
  speed-three:
    name: Speed check on three machines
    needs: [speed, speed-part]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # to count the earlier comparisons kept as artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # pnpm's packages come from main's store in GitHub's cache (the Tool cache workflow fills
      # it), read only: with no exact hit, the newest store of main under the same prefix, so a
      # pull request that changes the lockfile downloads only the difference.
      - name: Where pnpm keeps its packages, and main's key for them
        id: store
        run: python3 .github/scripts/tools.py key pnpm-store >> "$GITHUB_OUTPUT"
      - name: The packages, from GitHub's cache (read only)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.store.outputs.pnpm_store_file }}
          key: ${{ steps.store.outputs.pnpm_store_key }}
          restore-keys: ${{ steps.store.outputs.pnpm_store_prefix }}
      - run: pnpm install --frozen-lockfile --filter @hrizzup/web

      # By pattern, never by name: a name that isn't there fails the download, and an artifact is
      # missing whenever the website wasn't touched or the Speed check never got to measure.
      - name: The three machines' results
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: speed-part-*
          path: ${{ runner.temp }}/parts
      - name: The Speed check's own results
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: speed-one-machine
          merge-multiple: true
          path: ${{ runner.temp }}/one

      # What to do, from what the jobs before it left: with no numbers from the Speed check there is
      # nothing to compare and no record; with them, compare, or, when a part left no results, keep a
      # not-run record. It reads the parts' result through env:, never in the script.
      - name: Is there anything to compare?
        id: plan
        if: ${{ !cancelled() }}
        env:
          PARTS_RESULT: ${{ needs.speed-part.result }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/side_by_side.py speed-plan "$RUNNER_TEMP/one" "$RUNNER_TEMP/parts" 3 "$RUNNER_TEMP/speed-comparison" >> "$GITHUB_OUTPUT"
      - name: The three machines' parts, put together and judged as the Speed check judges (reported only)
        if: ${{ !cancelled() && steps.plan.outputs.measure == 'true' }}
        working-directory: product/web
        run: >-
          node e2e/speed-check.ts --join "$RUNNER_TEMP/speed-comparison"
          "$RUNNER_TEMP/parts/speed-part-1" "$RUNNER_TEMP/parts/speed-part-2" "$RUNNER_TEMP/parts/speed-part-3"
          --report-only
      - name: The three machines against the one, page by page
        if: ${{ !cancelled() && steps.plan.outputs.measure == 'true' }}
        working-directory: product/web
        env:
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node e2e/speed-check.ts --compare "$RUNNER_TEMP/one/website.json" "$RUNNER_TEMP/speed-comparison/website.json" "$RUNNER_TEMP/speed-comparison"
      # Whatever happened above (unless the run was cancelled), a comparison that was due leaves a
      # record: if the step before it errored, this one writes a not-run record ("the comparison
      # failed"). It says which verdict the record has, for the artifact's name.
      - name: This comparison's verdict
        id: record
        if: ${{ !cancelled() && steps.plan.outputs.measured == 'true' }}
        env:
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/side_by_side.py finalize "$RUNNER_TEMP/speed-comparison" >> "$GITHUB_OUTPUT"
      - name: The verdicts and the three machines' numbers
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Speed check on three machines, beside the Speed check"
            echo
            cat "$RUNNER_TEMP/speed-comparison/comparison.md" 2>/dev/null || echo "Nothing was compared: the Speed check left no numbers."
            if [ -f "$RUNNER_TEMP/speed-comparison/website.md" ]; then
              echo
              echo "### The three machines' numbers (the Speed check's table, from the parts)"
              echo
              cat "$RUNNER_TEMP/speed-comparison/website.md"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: This comparison's record
        if: ${{ !cancelled() && steps.record.outputs.verdict != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: speed-comparison-${{ steps.record.outputs.verdict }}
          path: ${{ runner.temp }}/speed-comparison/comparison.json
          retention-days: 30
      - name: How many pull requests in a row compared clean
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
          OUT: ${{ runner.temp }}/speed-comparison
        run: python3 .github/scripts/side_by_side.py tally speed --limits product/web/e2e/speed-allowances.json --current "$OUT/comparison.json" >> "$GITHUB_STEP_SUMMARY"

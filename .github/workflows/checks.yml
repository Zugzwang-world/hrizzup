# Hrizzup: the checks on every pull request (PLAN.md section 3, "Checks sized to the change").
#
#   Quick checks    formatting and lint (Biome), type checks and unit tests (Turborepo),
#                   including the hand-over agreement's check (agreement/src/agreement.test.ts),
#                   the infrastructure tools' own tests (infra/vercel, infra/doppler,
#                   infra/slots, infra/supabase) and the checks' own scripts' tests
#                   (.github/scripts: tool downloads, affected parts)
#   Database check  first, the database-order check (infra/supabase/migration_order.py):
#                   every migration the pull request adds comes after the newest one on
#                   main as it is now, none already on main is touched, and
#                   newest-migration.txt names the newest; then builds a fresh database
#                   from infra/supabase/migrations and runs its tests, including "every
#                   table is locked" (row-level security)
#   Screen check    checks by name that Doppler stg_preview holds only the app's keys
#                   (infra/doppler/app-keys.txt), then asks it for the three its tests
#                   use, by name, for the tests alone (infra/doppler/named_keys.py); once
#                   Vercel's preview of the pull request is ready, opens it in
#                   Chromium and WebKit at every screen size (CLAUDE.md, "Screens fit
#                   every device"), signed out and signed in with a staging test account,
#                   then runs the website's journeys (product/web/e2e/journeys: every page
#                   opens; the test account signs in and out)
#   Speed check     the performance budgets (blueprint section 14): every page of the
#                   preview with Lighthouse (mobile preset, median of 5 runs) and the app's
#                   code size against main's; the numbers go on the pull request
#
# The job names are required checks in the "main" ruleset. Keep them in step.
# Turborepo's Remote Cache (Vercel) skips work already done for the same inputs. It signs
# in with GitHub's short-lived OIDC token, so no Vercel token is stored in GitHub.
# The tools these jobs download are pinned and read from GitHub's cache by that pin (the Tool
# cache workflow fills it from main): Playwright's browsers by Playwright's version, and the
# database's Docker images by the Supabase CLI's version (.github/scripts/tools.py). A
# download that's still needed is retried after a pause; a test never is.

name: Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: Quick checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # for the Remote Cache's short-lived token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Connect the Remote Cache
        uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        continue-on-error: true # without it the checks still run, just without the cache
        with:
          team: ${{ vars.TURBO_TEAM }}
      - run: pnpm install --frozen-lockfile
      - name: Formatting and lint
        run: pnpm exec biome ci .
      - name: Type checks and unit tests
        run: pnpm exec turbo run typecheck test
      - name: Infrastructure tools' tests
        run: |
          python3 -m unittest discover -s infra/vercel
          python3 -m unittest discover -s infra/doppler
          python3 -m unittest discover -s .github/scripts
          python3 -m unittest discover -s infra/slots
          python3 -m unittest discover -s infra/supabase
          python3 -m unittest discover -s infra/supabase/auth

  database:
    name: Database check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # main as it is now, and where this pull request branched from it
          persist-credentials: false
      # Staging and production apply migrations in timestamp order and refuse an older one,
      # so the pull request's new migrations must come after main's newest. If main gains a
      # migration after this passes, newest-migration.txt's one line conflicts, so GitHub
      # won't merge this until it's rebased and this runs again (CLAUDE.md, "Database changes").
      - name: The database-order check (rename your migration if main has moved past it)
        env:
          HEAD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 infra/supabase/migration_order.py --main origin/main --head "$HEAD_COMMIT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Connect the Remote Cache
        uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        continue-on-error: true
        with:
          team: ${{ vars.TURBO_TEAM }}
      - run: pnpm install --frozen-lockfile
      # The database's images (Postgres and the services that set up its schema) come from
      # GitHub's cache, by the Supabase CLI's version, when the tests will really run here
      # rather than come from the Remote Cache. Without them, the CLI pulls them itself, retrying.
      - name: Will the database tests run here?
        id: db
        run: python3 .github/scripts/tools.py database will-run >> "$GITHUB_OUTPUT"
      - name: The database's images, by the Supabase CLI's version
        id: images-key
        if: steps.db.outputs.run == 'true'
        run: python3 .github/scripts/tools.py key database-images >> "$GITHUB_OUTPUT"
      - name: The database's images, from GitHub's cache
        id: images
        if: steps.db.outputs.run == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.images-key.outputs.database_images_file }}
          key: ${{ steps.images-key.outputs.database_images_key }}
      - name: Load them into Docker
        if: steps.images.outputs.cache-hit == 'true'
        env:
          IMAGES: ${{ steps.images-key.outputs.database_images_path }}
        # Only a shortcut: if the copy won't load, the CLI pulls the images as before.
        run: |
          docker load -i "$IMAGES" || echo "::warning::The cached images didn't load; the Supabase CLI pulls them instead."
          rm -f "$IMAGES"
      - name: Fresh database from the migrations, then its tests
        run: pnpm exec turbo run test:db

  screens:
    name: Screen check
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      deployments: read # to find Vercel's preview of this pull request
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Does this change touch the website?
        id: affected
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/affected.py

      - name: Wait for Vercel's preview
        if: steps.affected.outputs.website == 'true'
        id: preview
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/wait_for_preview.py "$COMMIT"

      # The browsers, before any key is loaded: Playwright's Chromium and WebKit, at the builds
      # its version (from the lockfile) names, from GitHub's cache. Playwright skips any it
      # already has; a download it still needs is retried after a pause (tools.py retry, which
      # refuses anything but this download). The system libraries come from Ubuntu's mirrors
      # through apt, which retries on its own.
      - name: The browsers' cache key (Playwright's version)
        id: browsers-key
        if: steps.affected.outputs.website == 'true'
        run: python3 .github/scripts/tools.py key browsers >> "$GITHUB_OUTPUT"
      - name: The browsers, from GitHub's cache
        if: steps.affected.outputs.website == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.browsers-key.outputs.browsers_file }}
          key: ${{ steps.browsers-key.outputs.browsers_key }}
      - name: Browsers (Chromium and WebKit)
        if: steps.affected.outputs.website == 'true'
        working-directory: product/web
        run: |
          set -euo pipefail
          python3 ../../.github/scripts/tools.py retry -- pnpm exec playwright install chromium webkit
          pnpm exec playwright install-deps chromium webkit

      # Before any key is loaded: every name in stg_preview must be one of the app's keys
      # (infra/doppler/app-keys.txt), so a tool token there stops this job before it sits
      # beside the pull request's code (runbook Part 4, "Where each kind of key lives").
      # Names only: Doppler's names endpoint sends no values.
      - name: The previews' keys are the app's own (names only)
        if: steps.affected.outputs.website == 'true'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PREVIEW }}
        run: python3 infra/doppler/app_keys.py check stg_preview

      # The tests' own keys and nothing more: the test accounts' three (SUPABASE_URL,
      # SUPABASE_PUBLISHABLE_KEY, SUPABASE_SECRET_KEY), asked of stg_preview by name and given to
      # the tests' process alone, masked, never the whole config and never to a later step
      # (infra/doppler/named_keys.py, which refuses any name that isn't one of the app's keys).
      - name: Screen check and journeys on the preview
        if: steps.affected.outputs.website == 'true'
        working-directory: product/web
        env:
          BASE_URL: ${{ steps.preview.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          SCREENSHOTS_DIR: ${{ github.workspace }}/screenshots
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PREVIEW }} # read-only, for the three keys below
        run: >-
          python3 ../../infra/doppler/named_keys.py SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_SECRET_KEY
          -- pnpm exec playwright test

      - name: Screenshots for the founder (360, 768, 1440 and 1920 pixels)
        if: ${{ !cancelled() && steps.affected.outputs.website == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 30

  speed:
    name: Speed check
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      deployments: read # to find Vercel's preview of this pull request
      pull-requests: write # to show the numbers on the pull request
      id-token: write # for the Remote Cache's short-lived token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Connect the Remote Cache
        uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        continue-on-error: true
        with:
          team: ${{ vars.TURBO_TEAM }}
      - run: pnpm install --frozen-lockfile

      - name: Does this change touch the website or the app?
        id: affected
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/affected.py

      # The app: its Android code bundle, built as a build ships it, against main's.
      - name: "App: code size of this change"
        if: steps.affected.outputs.app == 'true'
        run: pnpm exec turbo run bundle-size --filter=@hrizzup/app
      - name: "App: code size on main (usually from the Remote Cache)"
        if: steps.affected.outputs.app == 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/main" "$BASE"
          cd "$RUNNER_TEMP/main"
          if [ ! -f product/app/scripts/bundle-size.ts ]; then
            echo "main doesn't measure the app's code size yet; only the limit is checked."
            exit 0
          fi
          pnpm install --frozen-lockfile --prefer-offline
          pnpm exec turbo run bundle-size --filter=@hrizzup/app
      - name: "App: compare with main"
        id: app
        if: steps.affected.outputs.app == 'true'
        working-directory: product/app
        run: node scripts/bundle-size.ts compare "$RUNNER_TEMP/main/product/app" "$GITHUB_WORKSPACE/speed-results"

      # The website: every page of this pull request's preview.
      - name: "Website: wait for Vercel's preview"
        if: ${{ !cancelled() && steps.affected.outputs.website == 'true' }}
        id: preview
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/wait_for_preview.py "$COMMIT"
      - name: "Website: let Chrome use its sandbox"
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        # Ubuntu 24.04 keeps programs from making the private namespaces Chrome's sandbox needs.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || echo "No such setting here; Chrome starts as it is."
      - name: "Website: prove the check counts other sites' code and embeds"
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        working-directory: product/web
        env:
          SPEED_OUT: ${{ runner.temp }}/speed-self-test
        run: node e2e/speed-check.ts --self-test
      - name: "Website: every page against its budget"
        id: website
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        working-directory: product/web
        env:
          BASE_URL: ${{ steps.preview.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          SPEED_OUT: ${{ github.workspace }}/speed-results
        run: node e2e/speed-check.ts

      - name: The numbers on the pull request
        if: ${{ !cancelled() && (steps.affected.outputs.website == 'true' || steps.affected.outputs.app == 'true') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          WEBSITE_OUTCOME: ${{ steps.website.outcome }}
          APP_OUTCOME: ${{ steps.app.outcome }}
        run: python3 .github/scripts/speed_comment.py speed-results
      - name: Lighthouse's reports (the run nearest each page's median)
        if: ${{ !cancelled() && steps.affected.outputs.website == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: speed-reports
          path: speed-results/reports/
          if-no-files-found: ignore
          retention-days: 30

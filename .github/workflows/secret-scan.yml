# Hrizzup: scan every commit for secrets (runbook step 1.6).
#
# Runs the open-source gitleaks scanner over the whole history on every push
# and pull request. It uses the gitleaks program directly, at a pinned version
# with its checksum checked, instead of a third-party action.
#
# GitHub Pro has no push protection for private repos, so this check can flag
# a secret but cannot stop it reaching GitHub. Once repository protections are
# on, it can also be made a required check so a flagged change can't be merged.
# The pre-commit hook in .githooks/ is what stops a secret before it is committed.

name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned version, checksum checked)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan every commit for secrets
        run: gitleaks git --redact --no-banner --verbose .

# Doppler's default for this repository: `doppler setup` reads this, so a plain
# `doppler run -- <command>` here runs it with the app's local config (hrizzup/dev),
# which references staging's values. Claude Code's own setup keys live in the separate
# project hrizzup-tools and are only ever used with an explicit
# `doppler run --project hrizzup-tools --config claude -- <command>`.
setup:
  - project: hrizzup
    config: dev

# The sign-in test, signed out (PLAN.md step 1.6b): it offers "Continue with Google", which opens
# Google's own sign-in page in the phone's browser (never a web view inside the app) through
# Supabase, and coming back without signing in leaves the app signed out, saying so. A test can't sign in to
# Google itself (the founder does, on his phone). Run by journeys/run.sh at a phone size and a
# tablet size (SIZE says which).
appId: com.hrizzup.app
name: The sign-in test offers Google, through the phone's browser
---
- launchApp:
    clearState: true
# As in app-opens.yaml: wait out a frozen system app's dialog on the slow CI emulator.
- runFlow:
    when:
      visible: ".*isn't responding"
    commands:
      - tapOn: "Wait"
- scrollUntilVisible:
    element:
      id: google-button
    timeout: 30000
- assertVisible:
    id: signed-out
- takeScreenshot: ${SIZE}-signed-out
- tapOn:
    id: google-button
# The browser's tab, on its way to Google: the app's screen is gone.
- extendedWaitUntil:
    notVisible:
      id: sign-in-test
    timeout: 30000
# A new phone's Chrome first shows its own welcome (and may ask about notifications): past it,
# without an account, as anyone would.
- runFlow:
    when:
      visible: "Use without an account"
    commands:
      - tapOn: "Use without an account"
- runFlow:
    when:
      visible: "No thanks"
    commands:
      - tapOn: "No thanks"
- runFlow:
    when:
      visible: "Don.t allow"
    commands:
      - tapOn: "Don.t allow"
# Google's own sign-in page, reached from the app's request through Supabase.
- extendedWaitUntil:
    visible: ".*(Sign in|Email or phone|to continue to).*"
    timeout: 45000
- takeScreenshot: ${SIZE}-google
# Back to the app without signing in (Chrome may first show its own welcome on a new phone).
- repeat:
    times: 4
    while:
      notVisible:
        id: sign-in-test
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: sign-in-message
      text: "Sign-in was cancelled."
    timeout: 30000
- assertVisible:
    id: signed-out
